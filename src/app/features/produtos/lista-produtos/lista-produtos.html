<h2>Total de produtos: {{ totalProdutos()}}</h2>
<h3>Valor total dos produtos: R${{ valorTotal() }}</h3>
<h3>Produto Selecionado:
  @if (produtoSelecionado()){
    <strong style="color: green;">{{ produtoSelecionado() }}</strong>
  } @else {
    <span style="color: gray;">Nenhum</span>
  }
</h3>

@for (item of produtos(); track item.nome) {
<app-produto [nome]="item.nome" [preco]="item.preco" (produtoSelecionado)="exibirProduto($event)">
</app-produto>
}

<button (click)="adicionarProduto()">Adicionar Produto</button>
<button (click)="substituirProdutos()">Substituir Lista</button>
